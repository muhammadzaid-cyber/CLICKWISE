name: Build & Release CLICKWISE Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_dev:
    name: Build Development APK
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore from secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Error: DEBUG_KEYSTORE_BASE64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore

      - name: Build CLICKWISE APK
        run: gradle assembleDebug

      - name: Upload Development APK
        uses: actions/upload-artifact@v4
        with:
          name: CLICKWISE-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Build & Publish Official Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate release tag and version progression
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, urllib.request

          tag_name = os.environ["TAG_NAME"]
          tag_version = tag_name[1:] if tag_name.startswith("v") else tag_name

          gradle_text = open("app/build.gradle.kts", "r", encoding="utf-8").read()
          code_match = re.search(r"versionCode\s*=\s*(?:overrideVersionCode\s*\?:\s*)?(\d+)", gradle_text)
          name_match = re.search(r'versionName\s*=\s*(?:overrideVersionName\s*\?:\s*)?"([^"]+)"', gradle_text)
          if not code_match or not name_match:
              sys.exit("Unable to parse versionCode/versionName from app/build.gradle.kts")

          app_version_code = int(code_match.group(1))
          app_version_name = name_match.group(1)

          if app_version_name != tag_version:
              sys.exit(
                  f"Version mismatch: tag '{tag_name}' expects versionName '{tag_version}', "
                  f"but app/build.gradle.kts has versionName '{app_version_name}'."
              )

          repo = os.environ["GITHUB_REPOSITORY"]
          latest_url = f"https://api.github.com/repos/{repo}/releases/latest"
          req = urllib.request.Request(
              latest_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "clickwise-release-workflow",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  latest_release = json.loads(resp.read().decode("utf-8"))
              for asset in latest_release.get("assets", []):
                  if asset.get("name") == "update.json":
                      meta_req = urllib.request.Request(
                          asset["browser_download_url"],
                          headers={"User-Agent": "clickwise-release-workflow"},
                      )
                      with urllib.request.urlopen(meta_req, timeout=15) as meta_resp:
                          prev_meta = json.loads(meta_resp.read().decode("utf-8"))
                      prev_code = int(prev_meta.get("versionCode", 0))
                      if app_version_code <= prev_code:
                          sys.exit(
                              f"versionCode must strictly increase: current={app_version_code}, "
                              f"previous release={prev_code}."
                          )
                      break
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          print(f"Validated release {tag_name} (versionName={app_version_name}, versionCode={app_version_code})")
          PY

      - name: Restore debug keystore from secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Error: DEBUG_KEYSTORE_BASE64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore

      - name: Build Signed CLICKWISE APK
        run: gradle assembleDebug

      - name: Package CLICKWISE.apk, calculate SHA-256, and generate update.json
        env:
          TAG_NAME: ${{ github.ref_name }}
          MIN_SUPPORTED_VERSION_CODE: ${{ vars.MINIMUM_SUPPORTED_VERSION_CODE || '1' }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CLICKWISE.apk

          # Generate release notes from tag annotation or recent commits since prior tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" | sed '/^[[:space:]]*$/d' || true)
          {
            if [ -n "$TAG_MSG" ]; then
              printf '%s\n\n' "$TAG_MSG"
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since ${PREV_TAG}:"
              git log --no-merges --pretty=format:"- %s" "${PREV_TAG}..${TAG_NAME}"
            else
              echo "Initial official CLICKWISE wireless update release:"
              git log --no-merges -n 10 --pretty=format:"- %s" "$TAG_NAME"
            fi
          } > dist/release-notes.md

          python3 - <<'PY'
          import hashlib, json, os, sys

          apk_path = "dist/CLICKWISE.apk"
          meta_path = "app/build/outputs/apk/debug/output-metadata.json"
          notes_path = "dist/release-notes.md"

          meta = json.load(open(meta_path, "r", encoding="utf-8"))
          element = meta["elements"][0]
          version_code = int(element["versionCode"])
          version_name = element["versionName"]
          application_id = meta["applicationId"]

          if application_id != "com.aistudio.clickwise.xkqmzt":
              sys.exit(f"Unexpected applicationId in APK metadata: {application_id}")

          sha256_hash = hashlib.sha256(open(apk_path, "rb").read()).hexdigest()
          release_notes = open(notes_path, "r", encoding="utf-8").read().strip()
          min_supported = int(os.environ.get("MIN_SUPPORTED_VERSION_CODE", "1"))

          update_payload = {
              "applicationId": application_id,
              "versionName": version_name,
              "versionCode": version_code,
              "minimumSupportedVersionCode": min_supported,
              "releaseNotes": release_notes,
              "apkAssetName": "CLICKWISE.apk",
              "sha256": sha256_hash,
          }

          with open("dist/update.json", "w", encoding="utf-8") as f:
              json.dump(update_payload, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Generated dist/update.json:")
          print(json.dumps({k: v for k, v in update_payload.items() if k != "releaseNotes"}, indent=2))
          PY

      - name: Publish Public Stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/CLICKWISE.apk \
            dist/update.json \
            --title "CLICKWISE ${TAG_NAME}" \
            --notes-file dist/release-notes.md \
            --verify-tag \
            --latest

      - name: Upload Release Artifacts Backup
        uses: actions/upload-artifact@v4
        with:
          name: CLICKWISE-Release-${{ github.ref_name }}
          path: |
            dist/CLICKWISE.apk
            dist/update.json
          if-no-files-found: error
          retention-days: 30
